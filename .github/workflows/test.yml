name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hooks:
    name: hooks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Run the hook tests
        run: bash tests/test-hooks.sh
