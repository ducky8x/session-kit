name: release

# Builds the Discord helper for both Mac architectures and publishes it as
# release assets for the tag: sk-discord-darwin-arm64, sk-discord-darwin-x64
# and checksums.txt. The tag must be v + the version in
# .claude-plugin/plugin.json, which the helper bundles at build time.
#
# Jobs:
# - check: checks the tag against plugin.json.
# - build-apple-silicon: runs .github/actions/build-helper on an Apple silicon
#   Mac. The action tests the helper, builds, signs and checks both binaries,
#   and uploads them with checksums.txt as the sk-discord artifact.
# - build-intel: runs the same action on an Intel Mac when no runner picked up
#   build-apple-silicon. GitHub cancels a job that waits too long for a runner
#   (about 15 minutes for v0.2.0). Each build job sets started=true in its
#   first step, so a build that ran and failed, such as a failing test, never
#   starts the Intel build. The Intel Mac can't run the arm64 binary, so only
#   the x64 binary runs --version there.
# - publish: downloads the artifact, checks the files against checksums.txt
#   and creates the release. It's the only job that can write to the repo.
# - no-runner: fails the run and says how to retry when no Mac runner picked
#   up the build.
#
# Run it by hand (workflow_dispatch) for a dry run: it does everything but
# create the release. Give it a tag to check that tag against plugin.json.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check everything, but don't create the release
        type: boolean
        default: true
      tag:
        description: Tag to check against plugin.json (default, the tag the run started from, else v + plugin.json's version)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      dry_run: ${{ steps.tag.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against plugin.json
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' .claude-plugin/plugin.json | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No version in .claude-plugin/plugin.json"
            exit 1
          fi
          if [ "$EVENT" = push ]; then
            tag=$REF_NAME
            dry_run=false
          else
            dry_run=$INPUT_DRY_RUN
            if [ -n "$INPUT_TAG" ]; then
              tag=$INPUT_TAG
            elif [ "$REF_TYPE" = tag ]; then
              tag=$REF_NAME
            else
              tag="v$version"
            fi
            # A manual run publishes only from the tag it was started on.
            if [ "$dry_run" != true ] && { [ "$REF_TYPE" != tag ] || [ "$tag" != "$REF_NAME" ]; }; then
              echo "::error::To publish from a manual run, start it from the tag $tag, or turn dry run on"
              exit 1
            fi
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag doesn't match plugin.json's version $version (the tag should be v$version)"
            exit 1
          fi
          echo "Tag $tag matches plugin.json's version $version (dry run: $dry_run)"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"

  build-apple-silicon:
    name: build (Apple silicon)
    needs: check
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      started: ${{ steps.started.outputs.started }}
    steps:
      # Job outputs survive a failed job, so started=true marks a build that
      # got a runner. It stays empty when no runner ever picked the job up.
      - name: Mark the build as started
        id: started
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-helper
        with:
          version: ${{ needs.check.outputs.version }}

  build-intel:
    name: build (Intel)
    needs: [check, build-apple-silicon]
    # GitHub reports a job no runner picked up as cancelled; failure is
    # accepted too in case that changes. !cancelled() keeps this job from
    # starting after someone cancels the run.
    if: >-
      !cancelled()
      && needs.check.result == 'success'
      && (needs.build-apple-silicon.result == 'cancelled' || needs.build-apple-silicon.result == 'failure')
      && needs.build-apple-silicon.outputs.started != 'true'
    runs-on: macos-26-intel
    timeout-minutes: 30
    outputs:
      started: ${{ steps.started.outputs.started }}
    steps:
      - name: Mark the build as started
        id: started
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Say why the build runs on Intel
        run: echo "::notice::No Apple silicon runner picked up the build, so it runs on an Intel Mac"

      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-helper
        with:
          version: ${{ needs.check.outputs.version }}

  publish:
    name: publish
    needs: [check, build-apple-silicon, build-intel]
    if: >-
      !cancelled()
      && (needs.build-apple-silicon.result == 'success' || needs.build-intel.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only CHANGELOG.md is read from the checkout, so the token isn't kept.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: sk-discord
          path: helper/build

      - name: Check the files against checksums.txt
        working-directory: helper/build
        run: |
          for f in sk-discord-darwin-arm64 sk-discord-darwin-x64; do
            if ! grep -q "  $f\$" checksums.txt; then
              echo "::error::checksums.txt has no line for $f"
              exit 1
            fi
          done
          sha256sum -c checksums.txt

      - name: Write the release notes
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## / { on = (index($0, "## " v " ") == 1); next }
            on
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::warning::CHANGELOG.md has no entry for $VERSION"
            echo "Release $VERSION." > "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Create the release
        if: needs.check.outputs.dry_run != 'true'
        working-directory: helper/build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            sk-discord-darwin-arm64 sk-discord-darwin-x64 checksums.txt

      - name: Dry run summary
        if: needs.check.outputs.dry_run == 'true'
        env:
          TAG: ${{ needs.check.outputs.tag }}
          MAC: ${{ needs.build-apple-silicon.result == 'success' && 'an Apple silicon Mac' || 'an Intel Mac' }}
        run: |
          {
            echo "Dry run for $TAG: built on $MAC, signed and checked; no release created."
            echo
            echo '```'
            cat helper/build/checksums.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  no-runner:
    name: no Mac runner
    needs: [check, build-apple-silicon, build-intel]
    if: >-
      !cancelled()
      && needs.check.result == 'success'
      && needs.build-apple-silicon.result != 'success'
      && needs.build-intel.result != 'success'
      && needs.build-apple-silicon.outputs.started != 'true'
      && needs.build-intel.outputs.started != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Say how to retry
        run: |
          echo "::error::Neither an Apple silicon nor an Intel Mac runner picked up the build, so nothing was published. Re-run all jobs once Mac runners are free."
          exit 1
